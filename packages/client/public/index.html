<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskmates</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<canvas id="office" tabindex="0" aria-label="Office view of your Claude Code agents. Arrow keys select an agent, Enter opens details, N jumps to agents that need you, Escape closes." aria-describedby="agents"></canvas>
<ul id="agents" class="sr-only" role="list"></ul>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="status"></div>
<div id="badge" hidden></div>
<aside id="card" role="dialog" aria-label="Agent details" hidden>
  <h2 id="card-name"></h2>
  <dl>
    <dt>Status</dt><dd id="card-status"></dd>
    <dt>Tool</dt><dd id="card-tool"></dd>
    <dt>Project</dt><dd id="card-dir"></dd>
    <dt>Model</dt><dd id="card-model"></dd>
    <dt>Tokens</dt><dd id="card-tokens"></dd>
    <dt>Est. cost</dt><dd id="card-cost"></dd>
    <dt>Elapsed</dt><dd id="card-elapsed"></dd>
    <dt>Subagents</dt><dd id="card-subs"></dd>
  </dl>
  <button id="card-close" type="button">Close (Esc)</button>
</aside>
<script src="/app.js" defer></script>
</body>
</html>
